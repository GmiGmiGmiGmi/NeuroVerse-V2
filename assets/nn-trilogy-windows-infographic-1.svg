<svg viewBox="0 0 1536 900" xmlns="http://www.w3.org/2000/svg" font-family="Nunito,Arial,sans-serif">
  <!-- soft background -->
  <rect x="0" y="0" width="1536" height="900" rx="32" fill="#f6faff"/>
  <ellipse cx="120" cy="60" rx="260" ry="130" fill="#e8f2ff" opacity=".8"/>
  <ellipse cx="1450" cy="700" rx="300" ry="160" fill="#eef6ff" opacity=".7"/>

  <!-- Title -->
  <text x="768" y="66" text-anchor="middle" font-size="42" font-weight="900" fill="#16324f">NEURONODE</text>
  <text x="768" y="104" text-anchor="middle" font-size="34" font-style="italic" font-weight="800" fill="#1267d4">Trilogy</text>
  <text x="768" y="136" text-anchor="middle" font-size="17" font-weight="900" letter-spacing="4" fill="#16324f">AAC · WINDOWS GUIDE</text>
  <text x="768" y="160" text-anchor="middle" font-size="15" fill="#5b7089">Turn on, connect, and start communicating</text>

  <!-- simple vector mascot (friendly robot, echoing Nodi) -->
  <g transform="translate(1330,40)">
    <rect x="-58" y="0" width="116" height="100" rx="24" fill="#1a2b45"/>
    <rect x="-46" y="14" width="92" height="72" rx="14" fill="#ffffff"/>
    <circle cx="-16" cy="48" r="9" fill="#16324f"/>
    <circle cx="16" cy="48" r="9" fill="#16324f"/>
    <path d="M-14 66 q14 12 28 0" stroke="#16324f" stroke-width="4" fill="none" stroke-linecap="round"/>
    <rect x="-8" y="-16" width="16" height="16" rx="6" fill="#1267d4"/>
    <circle cx="-58" cy="46" r="10" fill="#1267d4"/>
    <circle cx="58" cy="46" r="10" fill="#1267d4"/>
  </g>
  <g>
    <rect x="1085" y="8" width="205" height="56" rx="20" fill="#fff4de"/>
    <text x="1187" y="31" text-anchor="middle" font-size="13" font-weight="800" fill="#8a5a12">You've got this!</text>
    <text x="1187" y="49" text-anchor="middle" font-size="13" font-weight="800" fill="#8a5a12">New possibilities!</text>
  </g>

  <!-- ============ STEP COLUMNS ============ -->

  <!-- STEP 1 -->
  <rect x="40" y="200" width="354" height="470" rx="26" fill="#eaf2ff"/>
  <circle cx="90" cy="200" r="34" fill="#1267d4"/>
  <text x="90" y="211" text-anchor="middle" font-size="30" font-weight="900" fill="#fff">1</text>
  <text x="140" y="212" font-size="22" font-weight="900" fill="#16324f">Turn it on</text>
  <text x="140" y="236" font-size="14" fill="#5b7089">Press the power button.</text>

  <rect x="70" y="264" width="294" height="220" rx="18" fill="#fff"/>
  <rect x="100" y="292" width="234" height="150" rx="12" fill="#16324f"/>
  <rect x="112" y="304" width="210" height="118" rx="4" fill="#2a4a6e"/>
  <g fill="#5b8fd4">
    <rect x="120" y="312" width="30" height="24" rx="3"/><rect x="156" y="312" width="30" height="24" rx="3"/><rect x="192" y="312" width="30" height="24" rx="3"/><rect x="228" y="312" width="30" height="24" rx="3"/><rect x="264" y="312" width="30" height="24" rx="3"/><rect x="120" y="342" width="30" height="24" rx="3" fill="#8ec1f5"/><rect x="156" y="342" width="30" height="24" rx="3"/><rect x="192" y="342" width="30" height="24" rx="3" fill="#8ec1f5"/><rect x="228" y="342" width="30" height="24" rx="3"/><rect x="264" y="342" width="30" height="24" rx="3" fill="#8ec1f5"/>
  </g>
  <circle cx="318" cy="298" r="9" fill="#8ec1f5"/>
  <circle cx="318" cy="298" r="14" fill="none" stroke="#8ec1f5" stroke-width="2" opacity=".6"/>

  <rect x="70" y="500" width="294" height="60" rx="14" fill="#fff"/>
  <circle cx="98" cy="530" r="13" fill="#ffe9b8"/>
  <path d="M98 522 a8 8 0 0 1 5 14 h-10 a8 8 0 0 1 5 -14z" fill="#e8a723"/>
  <rect x="94" y="537" width="8" height="4" fill="#8a5a12"/>
  <text x="122" y="535" font-size="13" font-weight="700" fill="#16324f">Make sure it's charged first.</text>

  <!-- STEP 2 -->
  <rect x="414" y="200" width="354" height="470" rx="26" fill="#e6f7f3"/>
  <circle cx="464" cy="200" r="34" fill="#1fa98c"/>
  <text x="464" y="211" text-anchor="middle" font-size="30" font-weight="900" fill="#fff">2</text>
  <text x="514" y="212" font-size="22" font-weight="900" fill="#16324f">Check the cables</text>
  <text x="514" y="236" font-size="14" fill="#5b7089">Camera + NeuroNode plugged in.</text>

  <rect x="444" y="264" width="294" height="220" rx="18" fill="#fff"/>
  <rect x="480" y="300" width="222" height="70" rx="10" fill="#16324f"/>
  <circle cx="510" cy="335" r="12" fill="#5b8fd4"/>
  <circle cx="672" cy="335" r="12" fill="#5b8fd4"/>
  <path d="M510 347 v20 M672 347 v20" stroke="#5b8fd4" stroke-width="4" stroke-linecap="round" stroke-dasharray="2 6"/>
  <rect x="494" y="392" width="60" height="14" rx="6" fill="#1fa98c"/>
  <rect x="654" y="392" width="60" height="14" rx="6" fill="#1fa98c"/>
  <text x="524" y="430" text-anchor="middle" font-size="11" font-weight="800" fill="#16324f">EyeGaze</text>
  <text x="684" y="430" text-anchor="middle" font-size="11" font-weight="800" fill="#16324f">NeuroNode</text>

  <rect x="444" y="500" width="294" height="60" rx="14" fill="#fff"/>
  <circle cx="472" cy="530" r="13" fill="#cdeee5"/>
  <path d="M465 530 l5 5 9 -10" stroke="#1fa98c" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="496" y="535" font-size="13" font-weight="700" fill="#16324f">Should click in firmly.</text>

  <!-- STEP 3 -->
  <rect x="788" y="200" width="354" height="470" rx="26" fill="#fff1e4"/>
  <circle cx="838" cy="200" r="34" fill="#ed8427"/>
  <text x="838" y="211" text-anchor="middle" font-size="30" font-weight="900" fill="#fff">3</text>
  <text x="888" y="212" font-size="22" font-weight="900" fill="#16324f">Let it load</text>
  <text x="888" y="236" font-size="14" fill="#5b7089">Give Grid 3 a few seconds.</text>

  <rect x="818" y="264" width="294" height="220" rx="18" fill="#fff"/>
  <rect x="895" y="325" width="140" height="100" rx="20" fill="#1267d4"/>
  <text x="965" y="368" text-anchor="middle" font-size="26" font-weight="900" fill="#fff">Grid</text>
  <text x="965" y="398" text-anchor="middle" font-size="26" font-weight="900" fill="#fff">3</text>
  <path d="M925 425 l-14 20 26 -20 z" fill="#1267d4"/>

  <rect x="818" y="500" width="294" height="60" rx="14" fill="#fff"/>
  <path d="M840 519 h14 M840 541 h14" stroke="#e8a723" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M841 519 q6 10 0 11 q6 1 0 11" stroke="#e8a723" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <text x="864" y="535" font-size="13" font-weight="700" fill="#16324f">Ready when the home page shows.</text>

  <!-- STEP 4 -->
  <rect x="1162" y="200" width="354" height="470" rx="26" fill="#f1ecfb"/>
  <circle cx="1212" cy="200" r="34" fill="#8b5cf6"/>
  <text x="1212" y="211" text-anchor="middle" font-size="30" font-weight="900" fill="#fff">4</text>
  <text x="1262" y="212" font-size="22" font-weight="900" fill="#16324f">Position them</text>
  <text x="1262" y="236" font-size="14" fill="#5b7089">Comfortable, clear screen view.</text>

  <rect x="1192" y="264" width="294" height="220" rx="18" fill="#fff"/>
  <circle cx="1290" cy="340" r="26" fill="#fbcfa0"/>
  <path d="M1264 366 q26 -14 52 0 l0 40 q-26 10 -52 0 z" fill="#1267d4"/>
  <circle cx="1282" cy="332" r="3" fill="#16324f"/>
  <rect x="1390" y="330" width="60" height="80" rx="8" fill="#16324f"/>
  <path d="M1300 340 l88 -6" stroke="#8b5cf6" stroke-width="2" stroke-dasharray="4 5"/>
  <path d="M1300 348 l88 40" stroke="#8b5cf6" stroke-width="2" stroke-dasharray="4 5"/>

  <rect x="1192" y="500" width="294" height="60" rx="14" fill="#fff"/>
  <circle cx="1220" cy="530" r="13" fill="#e4d9fa"/>
  <circle cx="1215" cy="527" r="1.6" fill="#5b3ea8"/><circle cx="1225" cy="527" r="1.6" fill="#5b3ea8"/>
  <path d="M1214 534 q6 5 12 0" stroke="#5b3ea8" stroke-width="2" fill="none" stroke-linecap="round"/>
  <text x="1244" y="535" font-size="13" font-weight="700" fill="#16324f">Good posture helps tracking.</text>

  <!-- bottom banner -->
  <rect x="40" y="720" width="1456" height="110" rx="26" fill="#e8f2ff"/>
  <circle cx="105" cy="775" r="26" fill="#1fa98c"/>
  <path d="M93 775 l9 9 17 -19" stroke="#fff" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="148" y="768" font-size="22" font-weight="900" fill="#16324f">You're ready to go!</text>
  <text x="148" y="792" font-size="14" fill="#5b7089">NeuroNode connected, Grid 3 loaded — start communicating.</text>
  <text x="1470" y="780" text-anchor="end" font-size="15" font-style="italic" font-weight="800" fill="#1267d4">Small steps. Big conversations.</text>

  <!-- footer (vector brand mark, no external image) -->
  <circle cx="58" cy="868" r="16" fill="none" stroke="#16324f" stroke-width="3"/>
  <path d="M58 858 a10 10 0 1 0 7 17" fill="none" stroke="#ed8427" stroke-width="3" stroke-linecap="round"/>
  <text x="82" y="874" font-size="16" font-weight="900" fill="#16324f">CONTROL BIONICS</text>
  <text x="1496" y="878" text-anchor="end" font-size="12" font-weight="700" fill="#5b7089">People · Possibility · Progress</text>
</svg>
